name: PageSpeed Insights

on:
  workflow_run:
    workflows: ["Generate map tiles"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  pagespeed:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      pull-requests: 'write'

    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Find PR number for SHA
      id: pr
      run: |
        set -euo pipefail
        PR_NUMBER=$(gh api \
          "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
          --jq '.[0].number // empty')
        if [ -z "$PR_NUMBER" ]; then
          echo "::error::No PR found for SHA ${HEAD_SHA}"
          exit 1
        fi
        echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

    - name: Run PageSpeed Insights against preview
      id: psi
      continue-on-error: true
      env:
        PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      run: |
        set -euo pipefail
        DEEPLINK_QS="lat=40.71237739081636&lng=-73.94554574256036"

        PREVIEW_HOME_URL="https://static.empty.nyc/${BRANCH}"
        PREVIEW_DEEPLINK_URL="${PREVIEW_HOME_URL}?${DEEPLINK_QS}"
        PROD_HOME_URL="https://empty.nyc"
        PROD_DEEPLINK_URL="${PROD_HOME_URL}?${DEEPLINK_QS}"

        run_psi() {
          local url="$1" out="$2" enc
          enc=$(jq -rn --arg u "$url" '$u|@uri')
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${enc}&strategy=mobile&category=performance&key=${PAGESPEED_API_KEY}" \
            > "$out"
        }

        extract_row() {
          jq -r '[
            (.lighthouseResult.categories.performance.score * 100 | round | tostring),
            .lighthouseResult.audits["largest-contentful-paint"].displayValue,
            .lighthouseResult.audits["total-blocking-time"].displayValue,
            .lighthouseResult.audits["cumulative-layout-shift"].displayValue,
            .lighthouseResult.audits["first-contentful-paint"].displayValue,
            .lighthouseResult.audits["speed-index"].displayValue,
            .lighthouseResult.audits["total-byte-weight"].displayValue
          ] | @tsv' "$1"
        }

        run_psi "$PREVIEW_HOME_URL" psi-preview-home.json
        run_psi "$PREVIEW_DEEPLINK_URL" psi-preview-deeplink.json
        run_psi "$PROD_HOME_URL" psi-prod-home.json
        run_psi "$PROD_DEEPLINK_URL" psi-prod-deeplink.json

        IFS=$'\t' read -r PH_SCORE PH_LCP PH_TBT PH_CLS PH_FCP PH_SI PH_TBW < <(extract_row psi-preview-home.json)
        IFS=$'\t' read -r PD_SCORE PD_LCP PD_TBT PD_CLS PD_FCP PD_SI PD_TBW < <(extract_row psi-preview-deeplink.json)
        IFS=$'\t' read -r RH_SCORE RH_LCP RH_TBT RH_CLS RH_FCP RH_SI RH_TBW < <(extract_row psi-prod-home.json)
        IFS=$'\t' read -r RD_SCORE RD_LCP RD_TBT RD_CLS RD_FCP RD_SI RD_TBW < <(extract_row psi-prod-deeplink.json)

        ENC_PREVIEW_HOME=$(jq -rn --arg u "$PREVIEW_HOME_URL" '$u|@uri')
        ENC_PREVIEW_DEEPLINK=$(jq -rn --arg u "$PREVIEW_DEEPLINK_URL" '$u|@uri')
        ENC_PROD_HOME=$(jq -rn --arg u "$PROD_HOME_URL" '$u|@uri')
        ENC_PROD_DEEPLINK=$(jq -rn --arg u "$PROD_DEEPLINK_URL" '$u|@uri')

        cat > psi-comment.md <<EOF
        ## PageSpeed Insights — mobile

        | Metric | [Preview home]($PREVIEW_HOME_URL) | [Preview deep-link]($PREVIEW_DEEPLINK_URL) | [Prod home]($PROD_HOME_URL) | [Prod deep-link]($PROD_DEEPLINK_URL) |
        | --- | --- | --- | --- | --- |
        | Performance | ${PH_SCORE} | ${PD_SCORE} | ${RH_SCORE} | ${RD_SCORE} |
        | Largest Contentful Paint | ${PH_LCP} | ${PD_LCP} | ${RH_LCP} | ${RD_LCP} |
        | Total Blocking Time | ${PH_TBT} | ${PD_TBT} | ${RH_TBT} | ${RD_TBT} |
        | Cumulative Layout Shift | ${PH_CLS} | ${PD_CLS} | ${RH_CLS} | ${RD_CLS} |
        | First Contentful Paint | ${PH_FCP} | ${PD_FCP} | ${RH_FCP} | ${RD_FCP} |
        | Speed Index | ${PH_SI} | ${PD_SI} | ${RH_SI} | ${RD_SI} |
        | Total Page Weight | ${PH_TBW} | ${PD_TBW} | ${RH_TBW} | ${RD_TBW} |

        Full reports: [preview home](https://pagespeed.web.dev/analysis?url=${ENC_PREVIEW_HOME}) · [preview deep-link](https://pagespeed.web.dev/analysis?url=${ENC_PREVIEW_DEEPLINK}) · [prod home](https://pagespeed.web.dev/analysis?url=${ENC_PROD_HOME}) · [prod deep-link](https://pagespeed.web.dev/analysis?url=${ENC_PROD_DEEPLINK})
        EOF

    - name: Upload PageSpeed reports
      if: steps.psi.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: pagespeed-insights
        path: |
          psi-preview-home.json
          psi-preview-deeplink.json
          psi-prod-home.json
          psi-prod-deeplink.json
          psi-comment.md
        if-no-files-found: error

    - name: Post PageSpeed results to PR
      if: steps.psi.outcome == 'success'
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        header: pagespeed
        number: ${{ steps.pr.outputs.number }}
        path: psi-comment.md
