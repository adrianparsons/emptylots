name: Build and deploy static Frontend with Node.js

on:
  push:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_BUCKET_WEB: 'nyc-lots-web'
  GCP_PROJECT: 'empty-lots'
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  URL_PREFIX: ${{ github.head_ref || github.ref_name }}

jobs:
  build:

    runs-on: ubuntu-latest

    # Add "id-token" with the intended permissions.
    permissions:
      contents: 'read'
      id-token: 'write'

    strategy:
      matrix:
        node-version: [25.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci
    - run: npm audit --audit-level=moderate
    - run: PUBLIC_URL=${{ env.GCP_BUCKET_WEB }}/${{ env.URL_PREFIX }} make build.prod
    - name: Create zip file of static production site
      uses: actions/upload-artifact@v4
      with:
        name: emptynyc-prod
        path: dist/**
        if-no-files-found: error

    - id: auth
      uses: 'google-github-actions/auth@v3'
      with:
        project_id: ${{ env.GCP_PROJECT }}
        workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}

    - id: 'upload-files'
      uses: 'google-github-actions/upload-cloud-storage@v3'
      with:
        path: 'dist'
        destination: ${{env.GCP_BUCKET_WEB}}/${{github.head_ref || github.ref_name}}
        parent: false # will not create a "dist" directory in the bucket
        project_id: ${{ env.GCP_PROJECT }}
