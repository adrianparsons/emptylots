name: Build and deploy static Frontend with Node.js

on:
  push:
    branches: [ "main" ]
    tags: [ "**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_BUCKET_WEB: ${{ vars.GCP_BUCKET_WEB }}
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  BRANCH: ${{ github.head_ref || github.ref_name }}
  IS_PREVIEW: ${{ github.ref_name != 'main' && github.ref_type != 'tag' }}

jobs:
  build:

    runs-on: ubuntu-latest

    # Add "id-token" with the intended permissions.
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'

    strategy:
      matrix:
        node-version: [25.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci
    - run: npm audit --audit-level=moderate
    - run: make build.prod
      env:
        PUBLIC_URL: ${{ env.IS_PREVIEW == 'true' && './' || '/' }}
        TILE_CDN_URL: https://cdn.empty.nyc/${{ env.BRANCH }}
    - name: Create zip file of static production site
      uses: actions/upload-artifact@v4
      with:
        name: emptynyc-prod
        path: dist/**
        if-no-files-found: error

    - id: auth
      uses: 'google-github-actions/auth@v3'
      with:
        project_id: ${{ env.GCP_PROJECT }}
        workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}

    - id: 'upload-files'
      uses: 'google-github-actions/upload-cloud-storage@v3'
      with:
        path: 'dist'
        destination: ${{ env.GCP_BUCKET_WEB }}/${{ env.BRANCH }}
        parent: false # will not create a "dist" directory in the bucket
        project_id: ${{ env.GCP_PROJECT }}

    - name: Post preview URL to PR
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        header: preview-url
        message: |
          Preview: https://static.empty.nyc/${{ env.BRANCH }}
          (updated for commit ${{ github.event.pull_request.head.sha }})

    - name: Run PageSpeed Insights against preview
      if: github.event_name == 'pull_request'
      id: psi
      continue-on-error: true
      env:
        PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      run: |
        set -euo pipefail
        HOME_URL="https://static.empty.nyc/${BRANCH}"
        DEEPLINK_URL="${HOME_URL}?lat=40.71237739081636&lng=-73.94554574256036"

        run_psi() {
          local url="$1" out="$2" enc
          enc=$(jq -rn --arg u "$url" '$u|@uri')
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${enc}&strategy=mobile&category=performance&key=${PAGESPEED_API_KEY}" \
            > "$out"
        }

        extract_row() {
          jq -r '[
            (.lighthouseResult.categories.performance.score * 100 | round | tostring),
            .lighthouseResult.audits["largest-contentful-paint"].displayValue,
            .lighthouseResult.audits["total-blocking-time"].displayValue,
            .lighthouseResult.audits["cumulative-layout-shift"].displayValue,
            .lighthouseResult.audits["first-contentful-paint"].displayValue,
            .lighthouseResult.audits["speed-index"].displayValue
          ] | @tsv' "$1"
        }

        run_psi "$HOME_URL" psi-home.json
        run_psi "$DEEPLINK_URL" psi-deeplink.json

        IFS=$'\t' read -r H_SCORE H_LCP H_TBT H_CLS H_FCP H_SI < <(extract_row psi-home.json)
        IFS=$'\t' read -r D_SCORE D_LCP D_TBT D_CLS D_FCP D_SI < <(extract_row psi-deeplink.json)

        ENC_HOME=$(jq -rn --arg u "$HOME_URL" '$u|@uri')
        ENC_DEEPLINK=$(jq -rn --arg u "$DEEPLINK_URL" '$u|@uri')

        cat > psi-comment.md <<EOF
        ## PageSpeed Insights — mobile

        | Metric | [Home]($HOME_URL) | [Deep-link]($DEEPLINK_URL) |
        | --- | --- | --- |
        | Performance | ${H_SCORE} | ${D_SCORE} |
        | LCP | ${H_LCP} | ${D_LCP} |
        | TBT | ${H_TBT} | ${D_TBT} |
        | CLS | ${H_CLS} | ${D_CLS} |
        | FCP | ${H_FCP} | ${D_FCP} |
        | Speed Index | ${H_SI} | ${D_SI} |

        Full reports: [home](https://pagespeed.web.dev/analysis?url=${ENC_HOME}) · [deep-link](https://pagespeed.web.dev/analysis?url=${ENC_DEEPLINK})
        EOF

    - name: Upload PageSpeed reports
      if: github.event_name == 'pull_request' && steps.psi.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: pagespeed-insights
        path: |
          psi-home.json
          psi-deeplink.json
          psi-comment.md
        if-no-files-found: error

    - name: Post PageSpeed results to PR
      if: github.event_name == 'pull_request' && steps.psi.outcome == 'success'
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        header: pagespeed
        path: psi-comment.md
