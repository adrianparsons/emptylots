name: Generate map tiles

on:
  push:
    branches: [ "**" ]
    paths: [ "*.dockerfile", "build/*", "*.github/workflows" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  GCP_BUCKET_TILES: 'nyc-lots-tiles'
  GCP_PROJECT: 'empty-lots'
  GCP_WORKLOAD_IDENTITY_PROVIDER: 'projects/415223443345/locations/global/workloadIdentityPools/github/providers/emptylots'

jobs:
  build:
    runs-on: ubuntu-latest

    # Add "id-token" with the intended permissions.
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - uses: actions/checkout@v4
    - run: make tiles.vacant
    - run: make tiles.parking
    - run: make tiles.all_lots

    - name: Create zip of pmtiles (parking and vacant)
      uses: actions/upload-artifact@v4
      with:
        name: emptynyc-tiles
        path: tiles/*.pmtiles
        if-no-files-found: error

    - id: auth
      uses: 'google-github-actions/auth@v3'
      with:
        project_id: ${{ env.GCP_PROJECT }}
        workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}

    - id: 'upload-files'
      uses: 'google-github-actions/upload-cloud-storage@v3'
      with:
        path: 'tiles'
        destination: ${{env.GCP_BUCKET_TILES}}/${{github.head_ref || github.ref_name}}
        parent: false # will not create a "tiles" directory in the bucket
        glob: "**/*.pmtiles"
