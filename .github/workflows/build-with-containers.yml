name: Generate map tiles

on:
  push:
    branches: [ "**" ]
    paths: [ "*.dockerfile", "build/*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - run: make tiles.vacant
    - run: make tiles.parking
    - run: make tiles.all_lots

    - name: Create zip of pmtiles (parking and vacant)
      uses: actions/upload-artifact@v4
      with:
        name: emptynyc-tiles
        path: tiles/*.pmtiles
        if-no-files-found: error
