name: Docker Image CI

on:
  push:
    branches: [ "**" ]
    paths: [ "*.dockerfile", "build/*" ]
  pull_request:
    branches: [ "**" ]
    paths: [ "*.dockerfile", "build/*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  packages: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the tippecanoe image
      run:  make create_image.tippecanoe
    - name: Build the gdal image with MapPLUTO dataset
      run:  make create_image.gdal

    - name: Log into registry ${{ env.REGISTRY }}
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push tippecanoe image
      run: make push_image.tippecanoe
    - name: Push gdal image
      run: make push_image.gdal
