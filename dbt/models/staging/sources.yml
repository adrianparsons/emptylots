version: 2

# Raw, vendored City of New York data. Each table is loaded into native
# BigQuery storage from a CSV snapshot in gs://nyc-lots-raw-data:
#
#   make vendor.<dataset>     # download from NYC -> stable path in the bucket
#   make bq.load.<dataset>    # bq load that snapshot -> raw_dob.* (schema in build/schemas/)
#
# `meta` records provenance (publisher, source URL, NYC Open Data id) and shows
# up in `dbt docs`. The upload time (and history, if object versioning is on) is
# tracked by GCS, not here. The load-time schema lives in
# build/schemas/<table>.json — all columns STRING, by design.

sources:
  - name: raw_dob
    database: empty-lots
    schema: raw_dob
    description: "NYC Department of Buildings open datasets, vendored as CSV snapshots."
    tables:
      - name: permit_issuance
        description: "DOB Permit Issuance — permits for construction and demolition."
        meta:
          publisher: "NYC Department of Buildings"
          source_url: "https://data.cityofnewyork.us/Housing-Development/DOB-Permit-Issuance/ipu4-2q9a"
          dataset_id: "ipu4-2q9a"
          download_url: "https://data.cityofnewyork.us/api/views/ipu4-2q9a/rows.csv?accessType=DOWNLOAD"

      - name: stalled_construction
        description: "DOB Stalled Construction Sites — complaints where construction has halted."
        meta:
          publisher: "NYC Department of Buildings"
          source_url: "https://data.cityofnewyork.us/Housing-Development/DOB-Stalled-Construction-Sites/i296-73x5"
          dataset_id: "i296-73x5"
          download_url: "https://data.cityofnewyork.us/api/views/i296-73x5/rows.csv?accessType=DOWNLOAD"

      - name: building
        description: "NYC Building Footprints — authoritative BIN to BBL mapping."
        meta:
          publisher: "NYC Department of Information Technology & Telecommunications (DOITT)"
          source_url: "https://data.cityofnewyork.us/City-Government/Building-Footprints/5zhs-2jue"
          dataset_id: "5zhs-2jue"
          download_url: "https://data.cityofnewyork.us/api/views/5zhs-2jue/rows.csv?accessType=DOWNLOAD"

  - name: nyc_pluto_historical
    database: empty-lots
    schema: nyc_pluto_historical
    description: "NYC Primary Land Use Tax Lot Output (PLUTO) from DCP's BYTES of the BIG APPLE."
    tables:
      - name: pluto
        description: >
          Legacy combined PLUTO (all yearly releases in one table). Superseded by
          the per-release raw_pluto.pluto_<version> tables; pending repoint + removal.
        meta:
          publisher: "NYC Department of City Planning"
          source_url: "https://www.nyc.gov/content/planning/pages/resources/datasets/mappluto-pluto-change"
          releases: "18v2_1, 19v2, 20v8, 21v3, 22v3, 23v3_1, 24v4_1, 25v3"

      - name: stg_geometry
        description: >
          Lot polygon geometry (GEOGRAPHY) keyed by BBL (float64), from
          MapPLUTO.geojsonl. Loaded via build/load_geojson_to_bigquery.sh
          (NEWLINE_DELIMITED_JSON / GEOJSON).
        meta:
          publisher: "NYC Department of City Planning"
          source_url: "https://www.nyc.gov/content/planning/pages/resources/datasets/mappluto-pluto-change"
          loaded_by: "build/load_geojson_to_bigquery.sh"
