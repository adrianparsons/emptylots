version: 2

sources:
  - name: nyc-lots
    description: "All lots from the PLUTO dataset"
    dataset: nyc_pluto_historical
    tables:
      - name: pluto
        description: "NYC lots dataset from PLUTO"
        columns:
          - name: borough
            description: "NYC borough code (BK, BX, MN, QN, SI)"
          - name: "Tax block"
            description: "Tax block number"
          - name: "Tax lot"
            description: "Tax lot number"
          - name: address
            description: "Property address"
          - name: lotarea
            description: "Lot area in square feet"
          - name: ownername
            description: "Property owner name"
          - name: borocode
            description: "Borough code (1-5)"
          - name: latitude
            description: "Latitude coordinate"
          - name: longitude
            description: "Longitude coordinate"
