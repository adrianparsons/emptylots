version: 2

# Raw, vendored City of New York data. Each table is loaded into native
# BigQuery storage from a CSV snapshot in gs://nyc-lots-raw-data:
#
#   make vendor.<dataset>     # download from NYC -> stable path in the bucket
#   make bq.load.<dataset>    # bq load that snapshot -> raw_dob.* (schema in build/schemas/)
#
# `meta` records provenance (publisher, source URL, NYC Open Data id) and shows
# up in `dbt docs`. The upload time (and history, if object versioning is on) is
# tracked by GCS, not here. The load-time schema lives in
# build/schemas/<table>.json — all columns STRING, by design.

sources:
  - name: raw_dob
    database: empty-lots
    schema: raw_dob
    description: "NYC Department of Buildings open datasets, vendored as CSV snapshots."
    tables:
      - name: permit_issuance
        description: "DOB Permit Issuance — permits for construction and demolition."
        config:
          meta:
            publisher: "NYC Department of Buildings"
            source_url: "https://data.cityofnewyork.us/Housing-Development/DOB-Permit-Issuance/ipu4-2q9a"
            dataset_id: "ipu4-2q9a"
            download_url: "https://data.cityofnewyork.us/api/views/ipu4-2q9a/rows.csv?accessType=DOWNLOAD"

      - name: stalled_construction
        description: "DOB Stalled Construction Sites — complaints where construction has halted."
        config:
          meta:
            publisher: "NYC Department of Buildings"
            source_url: "https://data.cityofnewyork.us/Housing-Development/DOB-Stalled-Construction-Sites/i296-73x5"
            dataset_id: "i296-73x5"
            download_url: "https://data.cityofnewyork.us/api/views/i296-73x5/rows.csv?accessType=DOWNLOAD"

      - name: building
        description: "NYC Building Footprints — authoritative BIN to BBL mapping."
        config:
          meta:
            publisher: "NYC Department of Information Technology & Telecommunications (DOITT)"
            source_url: "https://data.cityofnewyork.us/City-Government/Building-Footprints/5zhs-2jue"
            dataset_id: "5zhs-2jue"
            download_url: "https://data.cityofnewyork.us/api/views/5zhs-2jue/rows.csv?accessType=DOWNLOAD"

  - name: raw_planimetric
    database: empty-lots
    schema: raw_planimetric
    description: "NYC planimetric open data (OTI), vendored as CSV snapshots with WKT geometry."
    tables:
      - name: planimetric_parking
        description: >
          Parking lot polygons (the_geom as WKT MULTIPOLYGON, all columns STRING).
          Loaded via make vendor.parking && make bq.load.parking.
        config:
          meta:
            publisher: "NYC Office of Technology & Innovation"
            source_url: "https://data.cityofnewyork.us/d/7cgt-uhhz"
            dataset_id: "7cgt-uhhz"
            download_url: "https://data.cityofnewyork.us/api/v3/views/7cgt-uhhz/export.csv?accessType=DOWNLOAD"

  - name: raw_pluto
    database: empty-lots
    schema: raw_pluto
    description: "NYC MapPLUTO / PLUTO data from DCP's BYTES of the BIG APPLE, vendored as shapefile and CSV snapshots."
    config:
      meta:
        publisher: "NYC Department of City Planning"
        source_url: "https://www.nyc.gov/content/planning/pages/resources/datasets/mappluto-pluto-change"
    tables:
      - name: mappluto_geometry
        description: >
          Lot polygon geometry (GEOGRAPHY) keyed by BBL (float64), converted from
          the MapPLUTO shapefile via ogr2ogr (WGS-84, BBL only). Loaded via
          make vendor.geometry && make bq.load.geometry.
        config:
          meta:
            dataset_id: "26v1"

      - name: pluto_18v2_1
        description: "PLUTO release 18v2_1 (all columns STRING). Loaded via make bq.load.pluto."
      - name: pluto_19v2
        description: "PLUTO release 19v2 (all columns STRING). Loaded via make bq.load.pluto."
      - name: pluto_20v8
        description: "PLUTO release 20v8 (all columns STRING). Loaded via make bq.load.pluto."
      - name: pluto_21v3
        description: "PLUTO release 21v3 (all columns STRING). Loaded via make bq.load.pluto."
      - name: pluto_22v3
        description: "PLUTO release 22v3 (all columns STRING). Loaded via make bq.load.pluto."
      - name: pluto_23v3_1
        description: "PLUTO release 23v3_1 (all columns STRING). Loaded via make bq.load.pluto."
      - name: pluto_24v4_1
        description: "PLUTO release 24v4_1 (all columns STRING). Loaded via make bq.load.pluto."
      - name: pluto_25v3
        description: "PLUTO release 25v3 (all columns STRING). Loaded via make bq.load.pluto."
      - name: pluto_26v1
        description: "PLUTO release 25v3 (all columns STRING). Loaded via make bq.load.pluto."
